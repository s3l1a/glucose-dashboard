# Bind to loopback only so LAN neighbors cannot read unauthenticated JSON.
# Expose privately to your devices with `tailscale serve` or an authenticated proxy.
server {
    listen 127.0.0.1:80 default_server;
    listen [::1]:80 default_server;

    root /var/www/html;
    index index.html;
    server_name _;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
}
